<div class="header">
  <h1>Todo</h1>
</div>

<mat-card class="todo-card" appearance="outlined">
  <mat-card-actions>
    <button (click)="onBack()" matButton>
      Back
      <mat-icon>arrow_back</mat-icon>
    </button>
  </mat-card-actions>
  @if (!!todoError()) {
    <error-state [problem]="todoError()" />
  } @else if (todoResource.isLoading()) {
    <centered-spinner />
  } @else if (todoInfo(); as todo) {
    <mat-card-header>
      <div mat-card-avatar>
        <mat-icon [fontIcon]="statusIcons[todo.status]"></mat-icon>
      </div>
      <mat-card-title>{{ todo.name }}</mat-card-title>
      <mat-card-subtitle>
        {{ todo.status }}
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>{{ todo.description }}</p>

      <h3>Created:</h3>
      <p>{{ todo.createdDate | date: 'medium' }}</p>
      <h3>Due:</h3>
      <p>{{ todo.dueDate | date: 'medium' }}</p>
    </mat-card-content>
    <mat-card-actions>
      <button (click)="onEdit()" matButton>
        Edit
        <mat-icon>edit</mat-icon>
      </button>
      <button (click)="onDelete()" matButton>
        Delete
        <mat-icon>delete</mat-icon>
      </button>
    </mat-card-actions>
  } @else {
    <error-state />
  }
</mat-card>
