<div class="header">
  <h1>Todo</h1>
</div>

<mat-card class="todo-card" appearance="outlined">
  <mat-card-actions>
    <button (click)="onBack()" matButton>
      Back
      <mat-icon>arrow_back</mat-icon>
    </button>
  </mat-card-actions>
  @if (todoResource.isLoading()) {
    <mat-spinner [diameter]="140" />
  } @else {
    <mat-card-header>
      <div mat-card-avatar>
        <mat-icon [fontIcon]="statusIcons[todoInfo().status ?? 'ToDo']"></mat-icon>
      </div>
      <mat-card-title>{{ todoInfo().name }}</mat-card-title>
      <mat-card-subtitle>
        {{ todoInfo().status }}
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>{{ todoInfo().description }}</p>

      <h3>Created:</h3>
      <p>{{ todoInfo().createdDate | date: 'medium' }}</p>
      <h3>Due:</h3>
      <p>{{ todoInfo().dueDate | date: 'medium' }}</p>
    </mat-card-content>
    <mat-card-actions>
      <button (click)="onEdit()" matButton>
        Edit
        <mat-icon>edit</mat-icon>
      </button>
      <button matButton>
        Delete
        <mat-icon>delete</mat-icon>
      </button>
    </mat-card-actions>
  }
</mat-card>
