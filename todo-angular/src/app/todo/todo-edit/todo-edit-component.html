<div class="header">
  <h1>Todo Edit</h1>
</div>

@if (!!todoError()) {
  <error-state [problem]="todoError()" />
} @else if (todoLoading()) {
  <centered-spinner />
} @else {
  <mat-card class="todo-card" appearance="outlined">
    <mat-card-actions>
      <button (click)="onBack()" matButton>
        Back
        <mat-icon>arrow_back</mat-icon>
      </button>
    </mat-card-actions>
    <mat-card-header>
      <h1>Edit</h1>
    </mat-card-header>
    <mat-card-content>
      <todo-form-component [initialTodo]="todoInfo()" />
    </mat-card-content>
    <mat-card-actions>
      <button (click)="onUpdate()" matButton [disabled]="!formValid()">
        Confirm
        <mat-icon>check</mat-icon>
      </button>
    </mat-card-actions>
  </mat-card>
}
